# ==============================================================================
# GAB-EDT — Configuration développement
# ==============================================================================

spring:
  # Base de données H2 en mémoire (MVP Out of the box)
  datasource:
    url: jdbc:h2:mem:gabedt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  # JPA — dev settings
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: false
    clean-disabled: false

  # Redis local
  data:
    redis:
      host: localhost
      port: 6379

# Logging — verbose en dev
logging:
  level:
    ga.gabedt: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

# Swagger activé en dev
springdoc:
  swagger-ui:
    enabled: true

# JWT — secret de développement uniquement (jamais utilisé hors profil dev)
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatShouldBeAtLeast32BytesLongAndSecureForDevOnly}

app:
  mail:
    # Sans SMTP, le contenu des e-mails (liens de réinitialisation) est affiché dans la console
    log-content: true
