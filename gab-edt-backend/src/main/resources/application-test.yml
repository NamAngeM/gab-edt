# ==============================================================================
# GAB-EDT — Configuration test (tests d'intégration)
# ==============================================================================
# La datasource PostgreSQL (embarquée) est fournie par AbstractPostgresIntegrationTest.
# Même chaîne qu'en production : migrations Flyway puis validation Hibernate du schéma.

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    clean-disabled: false

  data:
    redis:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

jwt:
  secret: integrationTestSecretThatIsLongEnoughForHmacSha256

logging:
  level:
    root: WARN
    ga.gabedt: INFO

springdoc:
  swagger-ui:
    enabled: false
