# ==============================================================================
# GAB-EDT — Configuration production
# ==============================================================================

spring:
  # PostgreSQL — variables d'environnement
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA — production settings
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    clean-disabled: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Logging — production
logging:
  level:
    root: WARN
    ga.gabedt: INFO
  file:
    name: logs/gab-edt.log

# Swagger désactivé en production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Actuator — restreint en production
management:
  endpoints:
    web:
      exposure:
        include: health,info
