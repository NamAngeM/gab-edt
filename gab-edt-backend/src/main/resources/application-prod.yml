# ==============================================================================
# GAB-EDT — Configuration production
# ==============================================================================

spring:
  # PostgreSQL — variables d'environnement
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA — production settings
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    clean-disabled: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # SMTP (réinitialisation de mot de passe, notifications)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Derrière un reverse proxy HTTPS (Nginx/Traefik) : prise en compte de X-Forwarded-*
server:
  forward-headers-strategy: framework

# Logging — production
# Logs sur la sortie standard (collectés par Docker / l'hébergeur)
logging:
  level:
    root: WARN
    ga.gabedt: INFO

# Swagger désactivé en production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Actuator — restreint en production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
