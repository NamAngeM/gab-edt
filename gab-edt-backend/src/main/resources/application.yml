# ==============================================================================
# GAB-EDT — Configuration commune
# ==============================================================================

spring:
  application:
    name: gab-edt


  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    time-zone: UTC

  # Servlet
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis — désactivé par défaut, activé par profil
  data:
    redis:
      repositories:
        enabled: false

# Server
server:
  port: 8080
  servlet:
    context-path: /
  error:
    # Les messages d'erreur sont produits par GlobalExceptionHandler ; on n'expose pas les détails internes
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Redis n'est pas utilisé par l'application : sa sonde ne doit pas rendre le service « DOWN »
    redis:
      enabled: false

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Logging
logging:
  level:
    root: INFO
    ga.gabedt: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  # Obligatoire hors profil dev : 32 octets minimum (ex. `openssl rand -base64 48`). Aucun secret par défaut.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}          # 15 min
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 jours

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  mail:
    from: ${MAIL_FROM:no-reply@gab-edt.ga}
    log-content: false
  security:
    login:
      max-attempts: 5
      window-minutes: 15
  bootstrap:
    super-admin:
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      reset: ${BOOTSTRAP_SUPER_ADMIN_RESET:false}
