# ==============================================================================
# GAB-EDT — Déploiement de production (un serveur, une seule origine HTTPS)
# ==============================================================================
# Usage : cp .env.example .env  (remplir)  puis  docker compose -f docker-compose.prod.yml up -d --build
#
#   Internet ──HTTPS──> Caddy (certificat Let's Encrypt automatique)
#                         ├── /ws/*      -> backend:8080   (WebSocket, cookie de session même origine)
#                         ├── /api/v1/*  -> backend:8080   (application mobile, jeton Bearer)
#                         └── tout le reste -> frontend:3000 (Next.js, qui appelle l'API en interne)
# Actuator et PostgreSQL ne sont jamais exposés sur Internet.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabedt
      POSTGRES_USER: gabedt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabedt -d gabedt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../gab-edt-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/gabedt
      DB_USERNAME: gabedt
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32 octets minimum)}
      APP_FRONTEND_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gab-edt.ga}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../gab-edt-frontend
      args:
        NEXT_PUBLIC_WS_URL: https://${DOMAIN}/ws
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080/api/v1
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis (ex. edt.mon-ecole.ga)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
